{{define "title"}}{{siteTitle}} - Recent{{end}}

{{define "content"}}
<div class="intro-banner">
  <h1>Recent Links</h1>
  <p>Showing the most recently added links &middot; <a href="{{relURL "feed.xml"}}">RSS Feed</a> &middot; Browse older entries in the <a href="{{relURL "archive/"}}">Timeline Archive</a>.</p>
</div>

<div class="bookmark-list">
  {{range .Recent}}
    {{template "bookmark_card" .}}
  {{else}}
    <p>No bookmarks found.</p>
  {{end}}
</div>
{{end}}
