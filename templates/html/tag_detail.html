{{define "title"}}{{siteTitle}} - #{{.Tag.Name}}{{end}}
{{define "head"}}
<link rel="alternate" type="application/rss+xml" title="{{siteTitle}} - #{{.Tag.Name}} RSS" href="feed.xml">
{{end}}

{{define "content"}}
<div class="intro-banner">
  <h1>#{{.Tag.Name}}</h1>
  <p>{{len .Tag.Bookmarks}} bookmarks tagged with #{{.Tag.Name}} &middot; <a href="feed.xml">RSS Feed</a> &middot; <a href="{{relURL "tags/"}}">&larr; All Tags</a></p>
</div>

<div class="bookmark-list">
  {{range .Tag.Bookmarks}}
    {{template "bookmark_card" .}}
  {{end}}
</div>
{{end}}
