{{define "title"}}{{siteTitle}} - Search{{end}}

{{define "head"}}
<link href="{{relURL "pagefind/pagefind-component-ui.css"}}" rel="stylesheet">
<script src="{{relURL "pagefind/pagefind-component-ui.js"}}" type="module"></script>
{{end}}

{{define "content"}}
<div class="intro-banner" data-pagefind-ignore>
  <h1>Search {{siteTitle}}</h1>
  <p>Instant client-side full-text search powered by Pagefind.</p>
</div>

<div id="search-container" data-pagefind-ignore>
  <pagefind-config bundle-path="{{relURL "pagefind/"}}"></pagefind-config>
  <pagefind-input placeholder="Search bookmarks by title, note, or URL..." autofocus></pagefind-input>
  <pagefind-summary default-message="Type keywords above to search your bookmarks archive."></pagefind-summary>
  <pagefind-results hide-sub-results></pagefind-results>
  <pagefind-keyboard-hints></pagefind-keyboard-hints>
</div>
{{end}}
