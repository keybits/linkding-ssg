{{define "title"}}Search Bookmarks{{end}}

{{define "head"}}
<link href="{{relURL "pagefind/pagefind-ui.css"}}" rel="stylesheet">
<script src="{{relURL "pagefind/pagefind-ui.js"}}" type="text/javascript"></script>
{{end}}

{{define "content"}}
<div class="intro-banner" data-pagefind-ignore>
  <h1>Search Bookmarks</h1>
  <p>Instant client-side full-text search powered by Pagefind.</p>
</div>

<div id="search-box" data-pagefind-ignore></div>

<script>
  window.addEventListener('DOMContentLoaded', (event) => {
    new PagefindUI({
      element: "#search-box",
      showSubResults: false,
      showImages: false,
      baseUrl: "{{relURL "/"}}"
    });
  });
</script>
{{end}}
