name: Rolling Release

on:
  push:
    branches: [ main ]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="rolling-${GITHUB_SHA:0:7}"
          COMMIT="${GITHUB_SHA:0:7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$BUILD_DATE"

          go build -ldflags "$LDFLAGS" -o linkding-ssg

      - name: Package
        run: |
          tar czf linkding-ssg-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz linkding-ssg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linkding-ssg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: linkding-ssg-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          find . -name "linkding-ssg-*" -type f -name "*.tar.gz" -exec sha256sum {} \; > checksums.txt

      - name: Delete existing rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true

      - name: Create Rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rolling Release
          body: |
            **Automated rolling release built from the latest commit on the main branch.**

            ⚠️ This release is built from main and intended for testing.

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.event.head_commit.timestamp }}
          prerelease: true
          files: |
            linkding-ssg-*/*.tar.gz
            checksums.txt
